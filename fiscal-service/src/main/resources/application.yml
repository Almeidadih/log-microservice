server:
  port: 8081

spring:
  application:
    name: fiscal-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistica_fiscal}
    username: ${DB_USER:logistica}
    password: ${DB_PASSWORD:logistica}

  liquibase:
    enabled: true
    # Liquibase precisa de uma conexao JDBC "normal", mesmo o app rodando em R2DBC.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistica_fiscal}
    user: ${DB_USER:logistica}
    password: ${DB_PASSWORD:logistica}
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [notaFiscalId=%X{notaFiscalId}] - %msg%n"
  level:
    com.logistica.fiscal: INFO
