version: "3.9"

# Um Kafka/Zookeeper só, compartilhado pelos dois serviços — é isso que
# permite o logistica-service realmente consumir o que o fiscal-service
# publica. Cada serviço mantém seu PRÓPRIO Postgres (bases de dados
# separadas por serviço é a regra em microsserviços: cada um dono dos seus
# próprios dados).

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o topico antes de qualquer servico subir, evitando corrida entre
  # "quem publica primeiro" e "o topico ainda nao existe".
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic fiscal.nota-fiscal.eventos \
          --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic logistica.coleta.eventos \
          --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic logistica.entrega.eventos \
          --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic logistica.cancelamento.eventos \
          --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic avaliacao.ranking.eventos \
          --partitions 3 --replication-factor 1

  postgres-fiscal:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logistica_fiscal
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: logistica
    ports:
      - "5432:5432"
    volumes:
      - postgres_fiscal_data:/var/lib/postgresql/data

  postgres-frota:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logistica_frota
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: logistica
    ports:
      - "5433:5432"
    volumes:
      - postgres_frota_data:/var/lib/postgresql/data

  postgres-cep:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logistica_cep
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: logistica
    ports:
      - "5434:5432"
    volumes:
      - postgres_cep_data:/var/lib/postgresql/data

  postgres-avaliacao:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logistica_avaliacao
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: logistica
    ports:
      - "5435:5432"
    volumes:
      - postgres_avaliacao_data:/var/lib/postgresql/data

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logistica_auth
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: logistica
    ports:
      - "5436:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # protocolo AMQP (usado pelos serviços)
      - "15672:15672" # painel de administração (http://localhost:15672, guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  fiscal-service:
    build: ./fiscal-service
    depends_on:
      - postgres-fiscal
      - kafka-init
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres-fiscal
      DB_PORT: 5432
      DB_NAME: logistica_fiscal
      DB_USER: logistica
      DB_PASSWORD: logistica
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  logistica-service:
    build: ./logistica-service
    depends_on:
      - postgres-frota
      - kafka-init
      - cep-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres-frota
      DB_PORT: 5432
      DB_NAME: logistica_frota
      DB_USER: logistica
      DB_PASSWORD: logistica
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CEP_SERVICE_URL: http://cep-service:8083

  cep-service:
    build: ./cep-service
    depends_on:
      - postgres-cep
      - redis
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres-cep
      DB_PORT: 5432
      DB_NAME: logistica_cep
      DB_USER: logistica
      DB_PASSWORD: logistica
      REDIS_HOST: redis
      REDIS_PORT: 6379

  avaliacao-service:
    build: ./avaliacao-service
    depends_on:
      - postgres-avaliacao
      - kafka-init
      - rabbitmq
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres-avaliacao
      DB_PORT: 5432
      DB_NAME: logistica_avaliacao
      DB_USER: logistica
      DB_PASSWORD: logistica
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672

  dashboard-gateway:
    build: ./dashboard-gateway
    depends_on:
      - redis
      - kafka-init
    ports:
      - "8085:8085"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379

  auth-server:
    build: ./auth-server
    depends_on:
      - postgres-auth
    ports:
      - "9000:9000"
    environment:
      AUTH_ISSUER_URI: http://auth-server:9000
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_NAME: logistica_auth
      DB_USER: logistica
      DB_PASSWORD: logistica

  api-gateway:
    build: ./api-gateway
    depends_on:
      - fiscal-service
      - logistica-service
      - cep-service
      - avaliacao-service
      - dashboard-gateway
      - auth-server
    ports:
      - "8080:8080"
    environment:
      FISCAL_SERVICE_URL: http://fiscal-service:8081
      LOGISTICA_SERVICE_URL: http://logistica-service:8082
      CEP_SERVICE_URL: http://cep-service:8083
      AVALIACAO_SERVICE_URL: http://avaliacao-service:8084
      DASHBOARD_GATEWAY_WS_URL: ws://dashboard-gateway:8085
      # De dentro da rede do Docker Compose, o gateway fala com o auth-server
      # pelo nome do serviço. Se você testar o login pelo NAVEGADOR (fluxo
      # authorization_code), use http://localhost:9000 no navegador — os
      # dois hosts (interno "auth-server" e externo "localhost") apontam
      # para o mesmo lugar, só que vistos de dentro ou de fora do Compose.
      AUTH_SERVER_ISSUER_URI: http://auth-server:9000

volumes:
  postgres_fiscal_data:
  postgres_frota_data:
  postgres_cep_data:
  postgres_avaliacao_data:
  postgres_auth_data:

  
