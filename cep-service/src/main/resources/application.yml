server:
  port: 8083

spring:
  application:
    name: cep-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistica_cep}
    username: ${DB_USER:logistica}
    password: ${DB_PASSWORD:logistica}

  # Datasource JDBC "clássico" — usado só pelo CepImportService (import em
  # lote). Aponta para o MESMO banco que o r2dbc.url acima, só que via driver
  # bloqueante, que é o que JdbcTemplate/batchUpdate exigem.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistica_cep}
    username: ${DB_USER:logistica}
    password: ${DB_PASSWORD:logistica}

  liquibase:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistica_cep}
    user: ${DB_USER:logistica}
    password: ${DB_PASSWORD:logistica}
    change-log: classpath:db/changelog/db.changelog-master.xml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.logistica.cep: INFO
